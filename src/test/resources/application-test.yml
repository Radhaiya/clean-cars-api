# ===================================================================
#  TEST profile — used by @SpringBootTest (activated via @ActiveProfiles("test")).
#  In-memory H2 in MySQL mode — tests never touch the local Docker MySQL.
#  The Liquibase migrations are MySQL-only (AFTER, MODIFY, UPDATE..JOIN, ...), so
#  they are skipped here and Hibernate builds the schema from the entities.
# ===================================================================
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:cleancars;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=YEAR,VALUE,MONTH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  liquibase:
    enabled: false
  sql:
    init:
      mode: always
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true

app:
  jwt:
    secret: ${JWT_SECRET:test-only-hs256-signing-key-not-secret-000001}
    ttl-seconds: 3600
  internal:
    jwt:
      secret: ${INTERNAL_JWT_SECRET:test-only-internal-hs256-signing-key-0000001}
  razorpay:
    # No Razorpay calls in tests; empty values fail fast if a test ever paths through the gateway.
    key-id: test-key
    key-secret: test-secret
    webhook-secret: test-webhook-secret
  twilio:
    # No Twilio calls in tests; dummies keep the context green. Gateway-dependent
    # behaviour is covered in test via a mocked TwilioGateway.
    account-sid: test-sid
    auth-token: test-token
    verify-service-sid: test-service
  # Deterministic tests — jobs fire only via direct method invocation.
  jobs:
    trial-expiry:
      enabled: false

logging:
  level:
    "com.example.cleancarsapi": DEBUG
