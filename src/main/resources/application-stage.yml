# ===================================================================
#  STAGE profile — every value is injected from the environment.
#
#  Required env vars:
#    DB_URL           e.g. jdbc:mysql://db.stage.internal:3306/cleancars
#    DB_USERNAME
#    DB_PASSWORD
#    JWT_SECRET       HS256 signing key, >= 32 characters
#    FIREBASE_PROJECT_ID  Firebase project id (Firebase Auth is the only login path)
#  Optional:
#    JWT_TTL_SECONDS (default 3600)  DB_POOL_MAX (default 15)  SERVER_PORT (default 8080)
#    CORS_ALLOWED_ORIGINS  comma-separated origin patterns, e.g. https://staging.example.com
#                          (unset = no cross-origin browser calls allowed)
# ===================================================================
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:15}
  jpa:
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID}

logging:
  level:
    root: INFO
    "com.example.cleancarsapi": DEBUG
