# ===================================================================
#  clean-cars-api — COMMON configuration (all environments)
#
#  Environment overrides live in application-<profile>.yml:
#    local  -> src/main/resources/application-local.yml  (default)
#    stage  -> src/main/resources/application-stage.yml
#    prod   -> src/main/resources/application-prod.yml
#    test   -> src/test/resources/application-test.yml
#
#  Select one with:  SPRING_PROFILES_ACTIVE=prod   (or --spring.profiles.active=prod)
# ===================================================================
spring:
  application:
    name: clean-cars-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jackson:
    default-property-inclusion: non_null
    mapper:
      accept-case-insensitive-enums: true

  # Datasource: driver + pool tuning shared by all envs (URL/credentials per profile)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: cleancars-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000
      max-lifetime: 1800000

  # JPA / Hibernate — schema is owned by docker-entrypoint / migrations, never Hibernate
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  sql:
    init:
      mode: never

  # Global cap on ?size= for every paginated endpoint — Pageable silently clamps
  # a larger request down to this, it never errors. Per-endpoint @PageableDefault
  # sets each one's *default* size; this is just the ceiling.
  data:
    web:
      pageable:
        max-page-size: 50

server:
  port: ${SERVER_PORT:8089}
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

# Auth / JWT — signing secret comes from the active profile
app:
  jwt:
    issuer: clean-cars-api
    ttl-seconds: ${JWT_TTL_SECONDS:3600}        # access token lifetime
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}  # refresh token lifetime
  # Firebase Auth is the only login path (fronts Google, Apple, and phone OTP alike).
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:clean-cars-api}
  # Razorpay owns pricing/billing. Keys are profile-specific (test keys locally);
  # stage/prod read the env vars — unset there = binding fails (fail-closed).
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  # CORS — origins are profile-specific (see application-{local,stage,prod}.yml);
  # method/header/credentials policy is shared. TODO: stage/prod don't set
  # allowed-origin-patterns yet (CORS_ALLOWED_ORIGINS), so cross-origin calls are
  # rejected there until a real frontend origin is configured.
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:}
    allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
    allowed-headers: "Content-Type,Authorization"
    allow-credentials: true
    max-age: 3600
